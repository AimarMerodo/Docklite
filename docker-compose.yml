# ──────────────────────────────────────────────────────────────
# DockLite — production stack
#
# Three services on a private docker network. Only the frontend
# is published to the host (HTTP/HTTPS). Backend and DB are
# unreachable from outside the docker network — this is by design.
#
# For local development (Aimar's IntelliJ pointing at the DB),
# create a docker-compose.override.yml that re-publishes the DB.
# An example is included as docker-compose.override.example.yml.
# ──────────────────────────────────────────────────────────────

services:

  db:
    image: postgres:16-alpine
    container_name: docklite-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - docklite-net

  backend:
    build:
      context: ./backend
    container_name: docklite-backend
    restart: unless-stopped
    environment:
      # Database (built from POSTGRES_* values)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      # Auth
      JWT_SECRET: ${JWT_SECRET}

      # Bootstrap admin (created on first start)
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      # Public URL used to build invitation links
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}

      # Explicit unix socket path inside the container
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      # Lets the backend manage Docker on the host
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    networks:
      - docklite-net

  frontend:
    build:
      context: ./frontend
    container_name: docklite-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    depends_on:
      - backend
    networks:
      - docklite-net

networks:
  docklite-net:

volumes:
  postgres_data:
