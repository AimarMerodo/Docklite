spring:
  application:
    name: docklite-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/docklite}
    username: ${SPRING_DATASOURCE_USERNAME:docklite}
    password: ${SPRING_DATASOURCE_PASSWORD:docklitetest}
    driver-class-name: org.postgresql.Driver

jwt:
   secret: ${JWT_SECRET:unacadenalargadealmenostreintaydosbytesparahmac256}
   expiration: 900000           # access token: 15 min en ms
   refresh-expiration: 604800000 # refresh token: 7 días en ms

server:
   port: 8080

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:4200}
  admin:
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  invitation:
    default-max-uses: 1
    default-expires-in-days: 7
  docker:
    host: ${DOCKER_HOST:unix:///var/run/docker.sock}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never