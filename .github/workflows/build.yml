name: CI

# Runs on every PR (the real gate: checks show up before merging) and on
# pushes to main (post-merge smoke alarm). Both jobs always run — the repo
# is public (Actions are free) and always-present checks give a consistent
# signal even on cross-cutting changes (compose, env, docs).
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend:
    name: Backend · build & tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: docklite
          POSTGRES_USER: docklite
          POSTGRES_PASSWORD: docklitetest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docklite -d docklite"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
          cache: maven

      - name: Build (compile + tests)
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Production build
        working-directory: frontend
        run: npm run build

      # When the frontend gains unit tests (vitest is configured but there
      # are 0 specs today), add here:
      #   run: npm test
