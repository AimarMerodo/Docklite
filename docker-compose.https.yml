# ──────────────────────────────────────────────────────────────
# HTTPS overlay — only used when DockLite is deployed against a
# real domain. install.sh applies it automatically:
#
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d
#
# It mounts:
#   • the SSL nginx config rendered from default-ssl.conf.template
#   • the Let's Encrypt cert tree obtained by certbot
# ──────────────────────────────────────────────────────────────

services:
  frontend:
    volumes:
      - ./nginx-active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
