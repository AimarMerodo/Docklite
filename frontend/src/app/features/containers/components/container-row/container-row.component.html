<div class="w-[280px] shrink-0 flex flex-col gap-0.5 min-w-0">
  <span
    class="font-mono text-[13px] font-medium truncate"
    [class.text-ink]="isRunning()"
    [class.text-ink-muted]="!isRunning()"
  >
    {{ container().name }}
  </span>
  <span class="font-mono text-[10px] text-ink-tertiary truncate">
    {{ shortId() }}
  </span>
</div>

<div class="w-[120px] shrink-0">
  <app-status-pill [state]="container().state" />
</div>

<div class="w-[200px] shrink-0">
  <span class="font-mono text-xs text-ink-muted truncate">
    {{ container().image }}
  </span>
</div>

<div class="w-[100px] shrink-0">
  <span class="text-sm text-ink-muted">{{ uptime() }}</span>
</div>

<div class="flex-1 flex items-center justify-end gap-2">
  <button
    type="button"
    class="inline-flex items-center justify-center w-8 h-8 rounded bg-surface-2 hover:bg-surface-3 text-ink-muted hover:text-ink transition-colors"
    title="Ver detalle"
    (click)="$event.stopPropagation(); goToDetail()"
  >
    <svg
      viewBox="0 0 24 24"
      width="14"
      height="14"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="m4 17 6-6-6-6M12 19h8" />
    </svg>
  </button>

  <button
    type="button"
    class="inline-flex items-center justify-center w-8 h-8 rounded bg-success/15 hover:bg-success/25 text-success transition-colors disabled:opacity-30 disabled:cursor-not-allowed"
    [disabled]="isDemo() || isRunning() || pending() === 'start'"
    [title]="isDemo() ? 'No disponible en modo demo' : 'Arrancar'"
    (click)="$event.stopPropagation(); action.emit('start')"
  >
    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
      <path d="M8 5v14l11-7Z" />
    </svg>
  </button>

  <button
    type="button"
    class="inline-flex items-center justify-center w-8 h-8 rounded bg-warning/15 hover:bg-warning/25 text-warning transition-colors disabled:opacity-30 disabled:cursor-not-allowed"
    [disabled]="isDemo() || !isRunning() || pending() === 'restart'"
    [title]="isDemo() ? 'No disponible en modo demo' : 'Reiniciar'"
    (click)="$event.stopPropagation(); action.emit('restart')"
  >
    <svg
      viewBox="0 0 24 24"
      width="14"
      height="14"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
      <path d="M3 3v5h5" />
    </svg>
  </button>

  <button
    type="button"
    class="inline-flex items-center justify-center w-8 h-8 rounded bg-danger/15 hover:bg-danger/25 text-danger transition-colors disabled:opacity-30 disabled:cursor-not-allowed"
    [disabled]="isDemo() || !isRunning() || pending() === 'stop'"
    [title]="isDemo() ? 'No disponible en modo demo' : 'Detener'"
    (click)="$event.stopPropagation(); action.emit('stop')"
  >
    <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
      <rect x="4" y="4" width="16" height="16" rx="1" />
    </svg>
  </button>
</div>
