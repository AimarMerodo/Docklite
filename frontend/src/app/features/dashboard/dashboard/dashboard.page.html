<section class="mx-auto px-6 md:px-8 py-8 max-w-[1440px]">
  <header class="mb-8">
    <h1 class="text-[40px] leading-[1.15] font-semibold tracking-[-1px]">
      Hola, {{ auth.username() }}
    </h1>
    <p class="mt-2 text-base text-ink-subtle">
      Estado actual de tus contenedores Docker en este host.
    </p>
  </header>

  @if (errorMessage()) {
    <div
      class="mb-6 rounded-md border border-hairline-strong bg-surface-2 px-4 py-3 text-sm"
      role="alert"
    >
      {{ errorMessage() }}
    </div>
  }

  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-5">
    @for (card of cards(); track card.label) {
      <a
        [routerLink]="card.link"
        class="flex flex-col h-full min-h-36 rounded-lg border border-hairline bg-surface-1 hover:bg-surface-2 hover:border-hairline-strong transition-colors p-6"
      >
        <p class="text-[13px] font-medium tracking-[0.4px] uppercase text-ink-tertiary">
          {{ card.label }}
        </p>
        <p
          class="mt-auto text-[40px] leading-none font-semibold tracking-[-1px] tabular-nums"
        >
          {{ card.value }}
        </p>
        <p class="mt-2 min-h-[16px] text-xs text-ink-subtle">{{ card.hint }}</p>
      </a>
    }
  </div>

  <div class="mt-5 grid grid-cols-1 lg:grid-cols-12 gap-5">
    <app-container-status-panel
      class="lg:col-span-7"
      [containers]="containers()"
      [loading]="loading()"
    />
    <app-system-info-panel
      class="lg:col-span-5"
      [info]="systemInfo()"
      [loading]="loading()"
    />
    <app-recent-images-panel
      class="lg:col-span-5"
      [images]="images()"
      [loading]="loading()"
    />
    <app-activity-panel
      class="lg:col-span-7"
      [entries]="activity()"
      [loading]="loading()"
    />
  </div>
</section>
