<header
  class="sticky top-0 z-10 flex items-center justify-between h-14 px-4 md:px-6 border-b border-hairline bg-canvas/95 backdrop-blur"
>
  <div class="flex items-center gap-2 text-sm text-ink-subtle min-w-0">
    <span class="md:hidden font-semibold tracking-tight text-ink">DockLite</span>
  </div>

  <div class="flex items-center gap-2">
    <button
      type="button"
      class="inline-flex items-center justify-center w-9 h-9 rounded-md bg-surface-1 hover:bg-surface-2 text-ink-muted hover:text-ink transition-colors border border-hairline"
      [attr.aria-label]="
        theme.mode() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'
      "
      (click)="theme.toggle()"
    >
      @if (theme.mode() === 'dark') {
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
          />
        </svg>
      } @else {
        <svg
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
        </svg>
      }
    </button>

    <div class="relative">
      <button
        type="button"
        class="flex items-center gap-2 h-9 pl-1 pr-3 rounded-full bg-surface-1 hover:bg-surface-2 border border-hairline transition-colors"
        (click)="menuOpen.set(!menuOpen())"
        [attr.aria-expanded]="menuOpen()"
      >
        <span
          class="inline-flex items-center justify-center w-7 h-7 rounded-full bg-primary/15 text-primary text-xs font-semibold"
          aria-hidden="true"
        >
          {{ initial() }}
        </span>
        <span class="text-sm text-ink hidden sm:inline">{{ auth.username() }}</span>
        <span
          class="hidden sm:inline-block px-1.5 py-0.5 rounded-xs text-[10px] tracking-wide font-medium uppercase border border-hairline-strong text-ink-subtle"
        >
          {{ auth.role() }}
        </span>
      </button>

      @if (menuOpen()) {
        <div
          class="absolute right-0 mt-2 w-52 rounded-md bg-surface-3 border border-hairline-strong shadow-lg overflow-hidden"
          role="menu"
        >
          <a
            routerLink="/me"
            class="block px-3 py-2 text-sm text-ink hover:bg-surface-2"
            (click)="menuOpen.set(false)"
          >
            Mi perfil
          </a>
          <button
            type="button"
            class="w-full text-left px-3 py-2 text-sm text-ink hover:bg-surface-2"
            (click)="logout()"
          >
            Cerrar sesión
          </button>
        </div>
      }
    </div>
  </div>
</header>
