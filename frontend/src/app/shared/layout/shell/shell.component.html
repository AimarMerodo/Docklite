<app-sidebar class="hidden md:flex" />
<div class="flex-1 flex flex-col min-w-0">
  <app-topbar (menuToggle)="mobileNavOpen.set(true)" />
  <!-- scrollbar-gutter keeps content width stable when the scrollbar
       (dis)appears, so pages don't shift sideways while data loads. -->
  <main class="flex-1 overflow-y-auto overflow-x-hidden [scrollbar-gutter:stable]">
    <router-outlet />
  </main>
</div>

@if (mobileNavOpen()) {
  <div class="fixed inset-0 z-40 md:hidden">
    <div
      class="absolute inset-0 bg-overlay"
      (click)="mobileNavOpen.set(false)"
      aria-hidden="true"
    ></div>
    <div
      class="absolute inset-y-0 left-0"
      role="dialog"
      aria-modal="true"
      aria-label="Navegación"
    >
      <app-sidebar class="flex h-full" (navigated)="mobileNavOpen.set(false)" />
      <!-- Sits over the right end of the sidebar's h-14 logo header. -->
      <button
        type="button"
        class="absolute top-2 right-2 inline-flex items-center justify-center w-10 h-10 rounded-md text-ink-muted hover:text-ink hover:bg-surface-2 transition-colors"
        aria-label="Cerrar navegación"
        (click)="mobileNavOpen.set(false)"
      >
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>
}
