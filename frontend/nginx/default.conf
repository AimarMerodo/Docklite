# Default config: HTTP-only, no domain.
# Used when DockLite is deployed against a public IP (or for local testing).
# For HTTPS deployments the install.sh script generates a config from
# default-ssl.conf.template and mounts it on top of this one.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — let Angular handle deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend (no trailing slash → keep /api prefix).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
