# Default config: HTTP-only, no domain.
# Used when DockLite is deployed against a public IP (or for local testing).
# For HTTPS deployments the install.sh script generates a config from
# default-ssl.conf.template and mounts it on top of this one.

# In proxy mode DockLite sits behind ANOTHER reverse proxy that already
# terminates TLS and sets X-Forwarded-Proto. Pass that value through to the
# backend; when the request comes straight from the browser (ip mode) there
# is no incoming header, so fall back to our own $scheme.
map $http_x_forwarded_proto $forwarded_proto {
    ''      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — let Angular handle deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend (no trailing slash → keep /api prefix).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        # $http_host (not $host) — keeps the port, so the backend can rebuild
        # the exact origin the browser sees and its CORS check stays quiet.
        # X-Forwarded-Host is what Spring's ForwardedHeaderFilter actually
        # reads for host+port; without it the filter resets the port to the
        # scheme default and non-standard public ports fail the CORS check.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
